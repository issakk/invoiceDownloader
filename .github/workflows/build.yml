name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm install

      - name: 生成应用图标
        run: npx tauri icon assets/icon.svg

      - name: 运行单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 编译并打包
        run: npm run build -- --bundles msi,nsis

      - name: 输出便携版 exe（免安装，双击即用）
        shell: pwsh
        run: |
          $src = "src-tauri/target/release/invoicebox.exe"
          if (-not (Test-Path $src)) { throw "找不到编译产物：$src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $src "dist/InvoiceBox-portable.exe"
          $file = Get-Item "dist/InvoiceBox-portable.exe"
          "便携版：{0} ({1:N1} MB)" -f $file.Name, ($file.Length / 1MB)

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceBox-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/InvoiceBox-portable.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/InvoiceBox-portable.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
